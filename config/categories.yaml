# Категории товаров. Новая категория — новая запись здесь, код не трогаем.
# hints — что важно для рекламы в этой категории: подсказка для LLM при разборе
# материалов и (на этапе 3) для правил сценария.

categories:
  cosmetics:
    title: Косметика и уход
    hints: Никаких лечебных обещаний («лечит», «убирает морщины навсегда»). Важны состав, тип кожи, объём.
  health:
    title: Здоровье, БАДы, медтовары
    hints: Строгий режим — только факты с упаковки и сертификаты, никаких обещаний эффекта.
  food:
    title: Еда и напитки
    hints: Без «полезно для здоровья» без источника. Важны вкус, состав, вес, срок хранения.
  apparel:
    title: Одежда, обувь, аксессуары
    hints: Материал, размеры, посадка, уход, сезон.
  electronics:
    title: Электроника и гаджеты
    hints: Характеристики только из материалов, совместимость, гарантия.
  home:
    title: Дом, кухня, интерьер
    hints: Размеры, материал, как пользоваться, какую проблему решает.
  kids:
    title: Детские товары
    hints: Возраст, безопасность только по сертификатам, без пугающих сценариев.
  pets:
    title: Товары для животных
    hints: Для кого (вид, размер, возраст), состав.
  sport:
    title: Спорт и отдых
    hints: Без обещаний результата («минус 10 кг»), материалы, нагрузка.
  digital:
    title: Приложения, сервисы, онлайн-курсы
    hints: Показываем экран и сценарий использования, цена подписки только из материалов.
  service:
    title: Услуги
    hints: Где и как оказывается услуга, сроки, что входит.
  other:
    title: Другое
    hints: ""
