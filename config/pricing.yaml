# Тарифы для расчёта себестоимости. В коде цен нет — только здесь и в video_models.yaml.
# Перед сменой тарифа или модели сверяй с официальными страницами провайдеров.

# $ за 1M токенов: [вход, выход]
llm:
  claude-opus-5: [5.0, 25.0]
  claude-sonnet-5: [2.0, 10.0]
  claude-haiku-4-5: [1.0, 5.0]
  # DeepSeek с 16.08.2026 тарифицирует по часам: ночью (off-peak) вдвое дешевле.
  # Здесь ПИКОВАЯ цена (cache miss) — оценка с запасом.
  # Пик: 01:00–04:00 и 06:00–10:00 UTC по будням.
  deepseek-flash: [0.30, 1.20]     # V4.1 Flash (10.09.2026); off-peak 0.15 / 0.60
  deepseek-v4-pro: [1.32, 3.96]    # off-peak 0.66 / 1.98

elevenlabs:
  # Creator: $22/мес за 121 000 символов -> $0.000182 за символ (из AI_Host).
  usd_per_char: 0.000182
  # Scribe v2 (расшифровка голосовых): $0.22 за час аудио, по данным на 10.09.2026.
  stt_usd_per_hour: 0.22

tavily:
  # Поиск для креативщика. 1 кредит за обычный запрос, 2 за advanced.
  # Цена кредита ПРИМЕРНАЯ — свериться на tavily.com/#pricing под свой тариф.
  usd_per_credit: 0.008
