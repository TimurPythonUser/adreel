# Проверенный опыт по AI-роликам: что реально работает на генеративном видео.
# Источники — официальные гайды MiniMax H3, разборы практиков и наши собственные уроки.
# Сюда кладём только то, что проверено; выдумки и «кажется» — не сюда.
# Блок уходит в промпты креативщика и режиссёра (adreel/script/playbook.py).

# Что видеомодель тянет хорошо, а что разваливается. На этом строится весь сценарий.
model_can:
  - "Товар крупно на столе, в руке, в интерьере: медленный наезд, отъезд, дуга вокруг"
  - "Материя и среда: пар, конденсат, дым, пыль, вода, блик, ткань, огонь, снег"
  - "Человек как атмосфера: руки, силуэт, спина, фигура в расфокусе"
  - "Одно простое действие за сцену: крышка закрывается, чашка ставится, дверь открывается"
  - "Свет как событие: луч проходит по этикетке, лампа загорается, тень уезжает"

model_cannot:
  - "Читаемый текст, цифры, логотипы, интерфейсы — надписи кладём оверлеем на монтаже"
  - "Говорящие лица: наша озвучка отдельная, губы не совпадут"
  - "Мелкая моторика пальцев, сборка и разборка, счёт предметов"
  - "Несколько людей во взаимодействии, толпа, спорт, трюки"
  - "Трансформации, которым нужна геометрия, невидимая на стартовом кадре"

# Как склеивать сцены, чтобы ролик выглядел одним фильмом.
transitions:
  - name: "резка на движении"
    when: "почти все стыки"
    how: "сцена заканчивается на пике движения камеры или объекта, следующая подхватывает
      направление. Бесплатно"
  - name: "whip pan"
    when: "смена мира, энергии, локации"
    how: "конец сцены — быстрый смаз камеры в сторону, начало следующей — выход из смаза
      в ту же сторону. Смаз прячет склейку, направление продаёт непрерывность. Бесплатно"
  - name: "match cut"
    when: "связка двух идей, например проблема и решение"
    how: "одна форма, цвет или траектория на том же месте кадра в конце и в начале.
      Планируется на этапе сценария, не на монтаже. Бесплатно"
  - name: "склейка внутри одной генерации"
    when: "две короткие сцены в одном мире и при одном свете"
    how: "обе сцены уходят одной генерацией, модель режет внутри клипа сама. Свет и мир
      общие, поэтому стык честнее любого монтажного. Ещё и дешевле: у модели минимум
      5 секунд на вызов, и короткая сцена в одиночку стоит как пятисекундная"
  - name: "продолжение со стоп-кадра"
    when: "то же место, действие продолжается"
    how: "следующая сцена стартует с последнего кадра прошлого клипа. Камера остаётся
      стоять там же. Цена обычной сцены"
  - name: "бесшовное продолжение по хвосту клипа"
    when: "главный поворот ролика, нужен новый ракурс в том же мире"
    how: "модель получает кусок прошлого клипа и продолжает движение. Дорого — один-два
      раза за ролик, не чаще"

# Ритм вертикального ролика: у короткого формата нет места, чтобы спрятать слабый стык.
rhythm:
  - "Первые 2 секунды решают всё: товар или его эффект виден сразу, без разгона"
  - "Смена картинки каждые 2–4 секунды держит внимание"
  - "Сцена 4–6 секунд — одно событие; 8–15 секунд — только если герой пересекает
    пространство или сцена должна прийти в заметно другой кадр"
  - "Главная сцена (раскрытие товара) — ближе к середине, под неё ставим дроп музыки"
  - "Финал — товар крупно и призыв; надпись и цена оверлеем"

# Уроки, которые стоили нам времени или денег.
lessons:
  - "Стартовая картинка решает: мыльный или тесный кадр не спасёт никакой промпт"
  - "Контракт «что не меняется» в промпте идёт первым, иначе модель «улучшит» упаковку"
  - "Одно действие и одно движение камеры на сцену: два события подряд модель путает"
  - "Сплошная цепочка продолжений превращает ролик в один вялый план и копит искажения:
    не больше трёх подряд, дальше переякориваемся свежим кадром"
  - "Звук модели в каждой генерации свой и на стыках не сходится — звук кладём свой"
