# Проверенный опыт по AI-роликам: что реально работает на генеративном видео.
# Блок уходит в промпты креативщика, режиссёра и оператора (adreel/script/playbook.py).
# Сюда кладём только то, что подтверждено гайдами моделей, разборами практиков или
# нашими собственными граблями. Выдумки и «кажется» — не сюда.
#
# Источники (исследование 23.10.2026):
#   • официальный гайд MiniMax H3 и реальные прогоны H3 (fuser.studio, segmind.com);
#   • гайды fal по Kling 3.0 и Sora 2, Google Cloud «Ultimate prompting guide for Veo 3.1»;
#   • Higgsfield: «script → storyboard → shot list», «почему AI-видео не слушается промпта»;
#   • Runway / Runware / Nano Banana: референсы для одного героя и товара во всех кадрах;
#   • Versely, Luma, Morphic: склейки между AI-клипами (смаз, шторка, рифма, резка на движении);
#   • TikTok Creative / разборы UGC-рекламы 2026: Hook → Body → Close, PAS, демо, POV;
#   • классика монтажа: резка на движении, взгляд → объект, правило 180°, смена крупности.
# Наш урок 22.10.2026: ролик из сцен «товар крупно, наезд, капли» смотрится как одна
# ожившая фотография. Ниже всё построено так, чтобы этого больше не было.

# Сюжет: ролик — маленькая история, а не набор красивых планов товара.
story:
  - "Каркас короткой рекламы — Hook → Body → Close. Хук в первую секунду, тело —
    проблема и товар в деле, финал — доказательство и призыв"
  - "Хук — это СОБЫТИЕ в кадре: что-то падает, проливается, ломается, вспыхивает,
    появляется. Или сразу результат («после»), который хочется понять. Логотип и
    «представляем вам» хуком не бывают"
  - "Работающие форматы: проблема → решение (PAS), до/после, демонстрация в деле,
    POV от первого лица, мини-история героя, «3 причины», открытая петля (развязка
    в конце). Для дома и кухни сильнее всего визуальное прерывание и демо"
  - "Тайминг 15 с: хук 0–3, проблема 3–5, товар в деле 5–10, доказательство 10–12,
    оффер 12–15. На 30 с больше всего времени получает «товар в деле»"
  - "Показывай, а не рассказывай: товар РАБОТАЕТ на камеру — его открывают, наливают,
    надевают, включают, роняют, кладут в сумку. Доказательство — видимый результат"
  - "Сцена проблемы обычно БЕЗ товара: человек и его неудобство в его мире. Товар
    появляется как решение — так он и запоминается"
  - "Один герой и один мир на ролик: тот же человек, та же одежда, 1–3 локации. Кадры
    из разных миров не складываются в историю"
  - "Нативность бьёт глянец: живая ситуация, руки, реальные места выглядят как
    контент ленты, а не как телереклама"

# Раскадровка: как превратить сюжет в кадры, которые интересно смотреть.
coverage:
  - "У каждой сцены своя ЗАДАЧА и своё СОБЫТИЕ: что меняется в кадре за эти секунды.
    Движение камеры — не событие. «Наезд на товар» без действия — пустая сцена"
  - "Событие пиши как физику: из положения А в положение Б. Не «пьёт кофе», а «рука
    поднимает кружку от стола к губам, пар тянется вверх». Называй точки касания"
  - "У движения есть причина: ветер поднимает волосы, рука тянется, луч света ползёт
    по этикетке, дверь открывается и впускает свет"
  - "Меняй крупность: общий план показывает где, средний — кто и что делает, крупный —
    эмоцию или деталь, макро — фактуру. Два одинаковых плана подряд в одном месте
    читаются как скачок"
  - "Склейка по взгляду: герой смотрит — в следующем кадре то, на что он смотрит.
    Простейший способ связать два кадра смыслом"
  - "Держи направление движения: если герой идёт слева направо, в следующем кадре он
    продолжает идти слева направо (правило 180°)"
  - "Товар в каждом кадре — скучно. Пусть в части сцен главный — человек, его руки,
    среда, реакция. Кадр «товар крупно на нейтральном фоне» — максимум один на ролик,
    плюс финальная карточка"
  - "В кадре 1–2 человека и одно главное действие (плюс одно второстепенное). Каждый
    лишний человек и лишнее действие умножают шанс, что модель всё испортит"
  - "Герой описывается одинаково в каждой сцене: возраст, внешность, одежда — одной
    и той же фразой. Так модель держит одного человека"

# Что видеомодель тянет хорошо, а что разваливается. На этом строится весь сценарий.
model_can:
  - "Человек делает одно понятное действие: идёт, садится, оборачивается, поднимает
    предмет, отпивает, улыбается, хмурится, смотрит в окно — без речи"
  - "Руки взаимодействуют с товаром: берут, открывают крышку, наливают, наносят,
    кладут в сумку, протягивают другому"
  - "Материя и среда: пар, дым, вода, брызги, снег, пыль, ткань на ветру, огонь, блик,
    дождь по стеклу, разлетающиеся предметы"
  - "Свет как событие: луч проходит по этикетке, лампа загорается, шторы открываются,
    тень уезжает, фары проезжающей машины"
  - "Пространство: герой проходит через кадр, камера следует за ним, дверь открывает
    новую комнату, общий план улицы или кухни"
  - "Товар в мире: на столе среди вещей, в руке, в сумке, на полке, в машине —
    с реальным фото товара как референсом форма держится"
  - "Несколько коротких сцен одной генерацией: модель сама режет внутри клипа, свет
    и мир общие"

model_cannot:
  - "Читаемый текст, цифры, логотипы, интерфейсы — надписи кладём оверлеем на монтаже"
  - "Говорящие лица: наша озвучка отдельная, губы не совпадут. Герой молчит"
  - "Мелкая моторика пальцев, сборка и разборка, счёт предметов"
  - "Толпа, спорт, драки, трюки, больше двух людей во взаимодействии"
  - "Трансформации, которым нужна геометрия, невидимая на стартовом кадре"
  - "Два-три действия подряд в одной сцене: модель их путает или режет сама"

# Как склеивать сцены, чтобы ролик выглядел одним фильмом. Стык планируется на этапе
# сценария и промпта, а не «поправится на монтаже».
transitions:
  - name: "резка на движении"
    when: "почти все стыки"
    how: "сцена кончается на пике движения героя или камеры, следующая подхватывает
      направление. Статика → статика выдаёт склейку, движение её прячет. Бесплатно"
  - name: "резка по взгляду"
    when: "герой и то, что он видит или хочет"
    how: "в конце сцены герой смотрит в сторону, следующая показывает объект его взгляда
      с той же стороны. Бесплатно"
  - name: "whip pan"
    when: "смена мира, энергии, локации"
    how: "конец сцены — быстрый смаз камеры в сторону, начало следующей — выход из смаза
      в ту же сторону. Смаз прячет склейку, направление продаёт непрерывность. Бесплатно"
  - name: "шторка передним планом"
    when: "смена места или времени"
    how: "в конце сцены предмет или человек проходит вплотную к объективу и закрывает
      кадр, следующая сцена начинается с того, что он уходит из кадра и открывает новое
      место. Бесплатно"
  - name: "match cut"
    when: "связка двух идей, например проблема и решение"
    how: "одна форма, цвет или траектория на том же месте кадра в конце и в начале:
      круглая чашка → круглая крышка, падение → падение. Планируется в сценарии"
  - name: "склейка внутри одной генерации"
    when: "две короткие сцены в одном мире и при одном свете"
    how: "обе сцены уходят одной генерацией, модель режет внутри клипа сама. Свет и мир
      общие, стык честнее любого монтажного. Ещё и дешевле: у модели минимум 5 секунд
      на вызов"
  - name: "продолжение со стоп-кадра"
    when: "то же место, действие продолжается"
    how: "следующая сцена стартует с последнего кадра прошлого клипа. Камера остаётся
      стоять там же. Цена обычной сцены"
  - name: "бесшовное продолжение по хвосту клипа"
    when: "главный поворот ролика, нужен новый ракурс в том же мире"
    how: "модель получает кусок прошлого клипа и продолжает движение. Дорого — один-два
      раза за ролик, не чаще"

# Ритм вертикального ролика: у короткого формата нет места, чтобы спрятать слабый стык.
rhythm:
  - "Первая секунда решает: событие или результат сразу, без разгона"
  - "Смена картинки каждые 2–4 секунды держит внимание; длины сцен разные — ровный
    метроном усыпляет"
  - "Сцена 2–5 секунд — одно событие; 6–8 секунд — только если герой пересекает
    пространство или сцена приходит в заметно другой кадр"
  - "Главная сцена (раскрытие товара) — ближе к середине, под неё ставим дроп музыки"
  - "Финал — товар в мире или крупно и призыв; надпись и цена оверлеем"

# Уроки, которые стоили нам времени или денег.
lessons:
  - "Ролик из сцен «товар крупно, наезд, капли на нём» — одна ожившая фотография:
    нет событий, нет людей, нет истории. Так больше не делаем"
  - "Стартовая картинка решает: мыльный или тесный кадр не спасёт никакой промпт"
  - "Контракт «что не меняется» в промпте идёт первым, иначе модель «улучшит» упаковку"
  - "Одно действие и одно движение камеры на сцену: два события подряд модель путает"
  - "Без указания камеры модель снимает статику; без действия — «ожившее фото»"
  - "Сплошная цепочка продолжений превращает ролик в один вялый план и копит искажения:
    не больше трёх подряд, дальше переякориваемся свежим кадром"
  - "Звук модели в каждой генерации свой и на стыках не сходится — звук кладём свой"
